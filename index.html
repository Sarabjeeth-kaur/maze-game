<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dream Maze</title>
</head>
<body>

  <h1>🐷 Dream Pig Maze Challenge ☁️</h1>

  <div id="top-bar">
    <div id="timer">Time: 0s</div>
    <div id="best">Best: --</div>
  </div>

  <div id="warning"></div>

  <div id="game">

    <div id="start">START</div>

    <!-- ORIGINAL WALLS -->

    <div class="wall v1"></div>
    <div class="wall h1"></div>

    <div class="wall v2"></div>
    <div class="wall h2"></div>

    <div class="wall v3"></div>
    <div class="wall h3"></div>

    <div class="wall v4"></div>
    <div class="wall h4"></div>

    <div class="wall center"></div>

    <div class="wall block1"></div>
    <div class="wall block2"></div>

    <!-- NEW TRAPS -->

    <div class="wall trap1"></div>
    <div class="wall trap2"></div>
    <div class="wall trap3"></div>

    <!-- MAZE CORRIDOR -->

    <div class="wall maze1"></div>
    <div class="wall maze2"></div>
    <div class="wall maze3"></div>
    <div class="wall maze4"></div>

    <!-- DEAD END -->

    <div class="wall dead1"></div>
    <div class="wall dead2"></div>

    <!-- TINY PRECISION -->

    <div class="wall tiny1"></div>
    <div class="wall tiny2"></div>
    <div class="wall tiny3"></div>

    <!-- FINAL AREA -->

    <div class="wall final1"></div>
    <div class="wall final2"></div>

    <div id="end">END</div>

  </div>

  <script type="module" src="/src/main.ts"></script>

</body>
</html>
